name: Terraform PR

on:
  pull_request:
    paths: ["envs/**", ".github/workflows/**"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: ${{ vars.OWNER }}

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: fmt -check
        run: terraform fmt -check -recursive

      - name: init (sans backend)
        working-directory: envs/${{ matrix.env }}
        run: terraform init -input=false -backend=false

      - name: validate
        working-directory: envs/${{ matrix.env }}
        run: terraform validate

      - name: checkov
        run: |
          pip install --quiet checkov
          checkov -d envs/${{ matrix.env }} --framework terraform --compact --quiet --soft-fail

  plan:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            instance_type: t3.micro
          - env: prod
            instance_type: t3.small
    env:
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_instance_type: ${{ matrix.instance_type }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Credentials AWS (Learner Lab - cles de session du depot)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Credentials AWS (OIDC - compte personnel, aucun secret stocke)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Valeur jetable pour le plan
        run: |
          v="$(openssl rand -hex 16)"
          echo "::add-mask::$v"
          echo "TF_VAR_db_password=$v" >> "$GITHUB_ENV"

      - name: init
        run: terraform init -input=false

      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Poster le plan en commentaire
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          TF_ENV: ${{ matrix.env }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            let plan = fs.readFileSync(`envs/${env}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (plan tronque)';
            const marker = `<!-- terraform-plan-${env} -->`;
            const body = `${marker}\n### Plan Terraform : \`${env}\` (${process.env.PLAN_OUTCOME})\n<details open><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
