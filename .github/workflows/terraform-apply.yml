name: Terraform Apply

on:
  push:
    branches: [main]
    paths: ["envs/**"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: ${{ vars.OWNER }}

jobs:
  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_instance_type: t3.micro
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Credentials AWS (Learner Lab - cles de session du depot)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Credentials AWS (OIDC - compte personnel, aucun secret stocke)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - run: terraform init -input=false

      - name: plan (fichier de plan)
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          { echo '### Plan dev'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: apply (a partir du fichier de plan)
        run: terraform apply -input=false tfplan

      - name: Adresse de l'application
        run: echo "http://$(terraform output -raw alb_dns_name)" >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_instance_type: t3.small
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4

      - name: Credentials AWS (Learner Lab - cles de session du depot)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Credentials AWS (OIDC - compte personnel, aucun secret stocke)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - run: terraform init -input=false

      - name: plan (fichier de plan)
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          { echo '### Plan prod'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: apply (a partir du fichier de plan)
        run: terraform apply -input=false tfplan

      - name: Adresse de l'application
        run: echo "http://$(terraform output -raw alb_dns_name)" >> "$GITHUB_STEP_SUMMARY"


  drift:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            instance_type: t3.micro
          - env: prod
            instance_type: t3.small
    env:
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_instance_type: ${{ matrix.instance_type }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Credentials AWS (Learner Lab - cles de session du depot)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Credentials AWS (OIDC - compte personnel, aucun secret stocke)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Valeur jetable pour le plan
        run: |
          v="$(openssl rand -hex 16)"
          echo "::add-mask::$v"
          echo "TF_VAR_db_password=$v" >> "$GITHUB_ENV"

      - run: terraform init -input=false

      - name: Detection de derive
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Derive detectee sur ${{ matrix.env }} : le reel ne correspond plus au code."
            exit 1
          fi
          exit "$code"
